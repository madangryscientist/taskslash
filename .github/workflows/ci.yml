name: CI

# The gate from AGENTS.md, on a GitHub-hosted runner. The trigger is `pull_request` (never
# `pull_request_target`), so a pull request from a fork runs with a read-only token and no secrets.
# Actions are pinned to a commit; the tag is in the comment.
#
# The only secrets are the moon remote cache tokens, passed as MOON_REMOTE_TOKEN to the steps that
# run moon. A pull request reads with MOON_CACHE_READ_TOKEN (a repository secret) and its uploads are
# refused with a warning. A push to main writes with MOON_CACHE_WRITE_TOKEN, which lives only in the
# `moon-cache-write` environment that only main may deploy from (a release's tag push never enters
# it). A new repo has neither secret: moon then warns about a 401 and runs on its local cache. A fork sends no token; moon warns
# about the 401 and runs on its local cache.

on:
  pull_request:
  push:
    branches: [main]
  # template:begin cli
  # release.yml runs this same gate before it publishes.
  workflow_call:
  # template:end cli

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to main writes the moon remote cache: a running main push is never cancelled by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # moon 2.6.5 diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below).
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun scripts/check-workflows.ts .github/workflows/*.yml
      # template:begin rust
      # moon runs the cargo tasks in parallel, and on a fresh runner each would install the toolchain
      # rust-toolchain.toml pins at once and collide. Install it once first.
      - run: rustup toolchain install
      # template:end rust
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env: &moon-remote-token
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run lint
        env: *moon-remote-token
      - run: bun run format:check
        env: *moon-remote-token
      - run: bun run test
        env: *moon-remote-token
      - run: bun run build
        env: *moon-remote-token

  # template:begin web
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The apps and packages (what they import), plus what decides how they install and run.
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(apps/|packages/|\.moon/|package\.json$|bun\.lock$|bunfig\.toml$|\.node-version$|\.tool-versions$|tsconfig\.base\.json$|scripts/test-tmp-scope\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  apps:
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # moon 2.6.5 diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below).
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium-headless-shell
      - run: bunx moon run web:test-e2e
        env: *moon-remote-token
      # --force: web:test-e2e left a dist built with the e2e env, and a cache hit here would not
      # rebuild it, so the dry run below would check the e2e bundle. --force skips the cache read and
      # still uploads on main.
      - run: bunx moon run web:build --force
        env: *moon-remote-token
      - name: Web deploy dry run
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dry"
  # template:end web

  # template:begin self-test
  # The template's own check, removed by init: create a product for every choice init offers, then
  # check it against its flags and run its gate. The assertions fail the job; nothing is read from
  # the log.
  init:
    name: init (${{ matrix.licence }}, ${{ matrix.engines }}, web ${{ matrix.web }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        licence: [mit, elastic]
        engines: [ts, rust, ts rust]
        web: [false, true]
    # The product is made beside the checkout, so it is a repo of its own and not inside this one.
    defaults:
      run:
        working-directory: ${{ github.workspace }}/../product
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.web
        with:
          node-version-file: .node-version
      - name: Create a product from the template
        working-directory: ${{ github.workspace }}
        env:
          LICENCE: ${{ matrix.licence }}
          ENGINES: ${{ matrix.engines }}
          WEB: ${{ matrix.web }}
        run: |
          set -euo pipefail
          flags="--name DemoSlash --licence $LICENCE"
          for engine in $ENGINES; do flags="$flags --engine $engine"; done
          if [ "$WEB" = "true" ]; then flags="$flags --web"; fi
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          product="$GITHUB_WORKSPACE/../product"
          mkdir -p "$product"
          git ls-files -z | xargs -0 cp --parents -t "$product"
          cd "$product"
          # shellcheck disable=SC2086
          bun scripts/init.ts $flags
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "chore(repo): start the product"
      - name: The placeholder, the markers and init are gone
        run: |
          set -euo pipefail
          if grep -rni slashproduct . --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git; then
            echo "the placeholder is left in the product" >&2
            exit 1
          fi
          if grep -rn "template:begin\|template:end" . --exclude-dir=.git; then
            echo "a template marker is left in the product" >&2
            exit 1
          fi
          test ! -e scripts/init.ts
          test ! -e scripts/template
          test ! -e licences
          if grep -n "scripts/init.ts" .github/workflows/ci.yml; then exit 1; fi
      - run: bun install
      - name: Install the pinned Rust toolchain once, before moon runs cargo in parallel
        if: contains(matrix.engines, 'rust')
        run: rustup toolchain install
      - name: The product matches its flags
        # shellcheck disable=SC2086
        run: bun "$GITHUB_WORKSPACE/scripts/template/assert.ts" . $FLAGS
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - name: The Rust crates build, test, lint and format-check
        if: contains(matrix.engines, 'rust')
        run: |
          set -euo pipefail
          for task in build test lint format-check; do
            bunx moon run "core:$task" "bin:$task"
          done
          ./target/debug/demoslash --version | grep -Fx "demoslash 0.1.0"
      - name: The npm CLI prints its version
        if: matrix.engines == 'ts'
        run: bun run demoslash --version | grep -Fx "demoslash 0.1.0"
      - name: Install the Playwright browser
        if: matrix.web
        working-directory: ${{ github.workspace }}/../product/apps/web
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: The web app builds and its e2e suite passes
        if: matrix.web
        run: |
          set -euo pipefail
          bunx moon run web:test-e2e
          bunx moon run web:build --force
          (cd apps/web && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dry")
          cmp .github/workflows/ui-review.yml "$GITHUB_WORKSPACE/.github/workflows/ui-review.yml"
  # template:end self-test
